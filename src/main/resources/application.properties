spring.application.name=hiretrack

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hiretrack_db}}
spring.datasource.username=${DB_USERNAME:hiretrack_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hiretrack_db}}
spring.flyway.user=${DB_USERNAME:hiretrack_app}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-a-long-random-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://localhost:5173}}

logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc=INFO
